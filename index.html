<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal App V1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f4;
    color: #111;
}

/* SIDEBAR */

.app {
    display: flex;
    height: 100vh;
    overflow: hidden;
}

.sidebar {
    width: 64px;
    background: #151515;
    color: white;
    padding: 12px 8px;
    transition: width 0.2s;
    overflow: hidden;
}

.sidebar.open {
    width: 240px;
}

.toggle {
    width: 48px;
    height: 40px;
    border: 0;
    border-radius: 8px;
    background: #333;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    width: 44px;
    height: 44px;
    border: 3px solid white;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin: 16px auto;
    font-weight: 800;
}

.song {
    padding: 11px;
    border-radius: 8px;
    margin: 5px 0;
    cursor: pointer;
    white-space: nowrap;
}

.song:hover {
    background: #292929;
}

.song.active {
    background: white;
    color: black;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
}

.topbar {
    height: 64px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.title {
    font-size: 20px;
    font-weight: 700;
}

.buttons {
    display: flex;
    gap: 8px;
}

button {
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
}

button:hover {
    background: #eee;
}

/* CONTENT */

.content {
    height: calc(100vh - 64px);
    overflow: auto;
    padding: 20px;
    max-width: 950px;
    margin: auto;
}

.section {
    background: white;
    border: 1px solid #ddd;
    border-radius: 13px;
    margin-bottom: 14px;
    overflow: hidden;
}

.section-header {
    padding: 14px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.section-title {
    font-weight: 700;
}

.task {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
}

.task:last-child {
    border-bottom: 0;
}

.task span.completed {
    text-decoration: line-through;
    color: #999;
}

.task-actions {
    margin-left: auto;
}

.task-actions button {
    border: 0;
    background: transparent;
    padding: 3px 6px;
}

.attachments {
    padding: 13px 14px;
    background: #fafafa;
    border-top: 1px dashed #ddd;
}

.attachment {
    display: inline-block;
    background: #e9e9e9;
    padding: 6px 9px;
    border-radius: 15px;
    font-size: 13px;
    margin: 4px;
}

/* CALENDAR */

.calendar {
    position: fixed;
    right: 20px;
    top: 76px;
    width: 290px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    display: none;
    z-index: 10;
}

.calendar.visible {
    display: block;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
}

.calendar-grid div {
    text-align: center;
    padding: 7px;
    font-size: 12px;
}

.today {
    background: black;
    color: white;
    border-radius: 7px;
}

/* MOBILE */

@media(max-width:700px) {

    .sidebar.open {
        width: 210px;
    }

    .content {
        padding: 12px;
    }

    .topbar {
        padding: 0 10px;
    }

    .buttons button {
        font-size: 0;
    }

    .buttons button:first-child {
        font-size: 16px;
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <button class="toggle" onclick="toggleSidebar()">
            ☰
        </button>

        <div class="logo">
            PM
        </div>

        <div id="songs"></div>

        <button onclick="addSong()">
            ＋
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="title" id="title">
                Portal App
            </div>

            <div class="buttons">

                <button onclick="toggleCalendar()">
                    📅
                </button>

                <button onclick="exportData()">
                    Condividi aggiornamento
                </button>

                <button onclick="document.getElementById('fileInput').click()">
                    Importa
                </button>

            </div>

        </header>


        <section class="content" id="content"></section>

    </main>

</div>


<!-- CALENDARIO -->

<div class="calendar" id="calendar">

    <div class="calendar-header">

        <strong id="calendarTitle">
            Calendario
        </strong>

        <button onclick="toggleCalendar()">
            ✕
        </button>

    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

</div>


<input
    type="file"
    id="fileInput"
    accept=".json,.portal.json"
    style="display:none"
    onchange="importData(event)"
>


<script>

/* =========================
   DATI INIZIALI
========================= */

let data =
JSON.parse(localStorage.getItem("portalAppV1")) ||
{
    songs: [

        {
            name: "Brano 1",

            sections: [

                {
                    name: "Registrazioni",

                    tasks: [
                        { text: "Chitarra", done: false },
                        { text: "Synth", done: false },
                        { text: "Basso", done: false },
                        { text: "Voce", done: false }
                    ],

                    attachments: []
                },


                {
                    name: "Cose importanti",

                    tasks: [
                        {
                            text: "Controllare arrangiamento",
                            done: false
                        },

                        {
                            text: "Mandare riferimento",
                            done: false
                        }
                    ],

                    attachments: []
                },


                {
                    name: "Editing / Mix",

                    tasks: [
                        {
                            text: "Pulizia tracce",
                            done: false
                        },

                        {
                            text: "Controllo livelli",
                            done: false
                        }
                    ],

                    attachments: []
                }

            ]
        }

    ],

    selectedSong: 0
};


/* =========================
   SALVATAGGIO
========================= */

function saveData() {

    localStorage.setItem(
        "portalAppV1",
        JSON.stringify(data)
    );

}


/* =========================
   ESCAPE TESTO
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================
   RENDER
========================= */

function render() {

    renderSongs();

    const song =
        data.songs[data.selectedSong];

    document.getElementById("title").textContent =
        song.name;


    const content =
        document.getElementById("content");

    content.innerHTML = "";


    song.sections.forEach(
        (section, sectionIndex) => {

            const box =
                document.createElement("div");

            box.className = "section";


            box.innerHTML = `

                <div class="section-header">

                    <div class="section-title">
                        ${escapeHTML(section.name)}
                    </div>

                    <div>

                        <button
                            onclick="renameSection(${sectionIndex})">
                            Rinomina
                        </button>

                        <button
                            onclick="deleteSection(${sectionIndex})">
                            Elimina
                        </button>

                    </div>

                </div>

            `;


            section.tasks.forEach(
                (task, taskIndex) => {

                    const row =
                        document.createElement("div");

                    row.className = "task";


                    row.innerHTML = `

                        <input
                            type="checkbox"
                            ${task.done ? "checked" : ""}
                            onchange="
                                toggleTask(
                                    ${sectionIndex},
                                    ${taskIndex}
                                )
                            "
                        >

                        <span
                            class="${task.done ? "completed" : ""}">
                            ${escapeHTML(task.text)}
                        </span>

                        <div class="task-actions">

                            <button
                                onclick="
                                    renameTask(
                                        ${sectionIndex},
                                        ${taskIndex}
                                    )
                                ">
                                ✎
                            </button>

                            <button
                                onclick="
                                    deleteTask(
                                        ${sectionIndex},
                                        ${taskIndex}
                                    )
                                ">
                                ✕
                            </button>

                        </div>

                    `;


                    box.appendChild(row);

                }
            );


            const addTask =
                document.createElement("div");

            addTask.style.padding = "12px 14px";


            addTask.innerHTML = `

                <button
                    onclick="addTask(${sectionIndex})">
                    ＋ Aggiungi attività
                </button>

            `;

            box.appendChild(addTask);


            /* ALLEGATI */

            const attachments =
                document.createElement("div");

            attachments.className =
                "attachments";


            let attachmentHTML = "";

            if (
                section.attachments.length === 0
            ) {

                attachmentHTML =
                    `<span style="color:#777">
                        Nessun allegato
                    </span>`;

            } else {

                attachmentHTML =
                    section.attachments
                        .map(
                            file =>
                            `<span class="attachment">
                                ${escapeHTML(file)}
                            </span>`
                        )
                        .join("");

            }


            attachments.innerHTML = `

                <strong>
                    Allegati
                </strong>

                <div>
                    ${attachmentHTML}
                </div>

                <br>

                <button
                    onclick="
                        addAttachment(${sectionIndex})
                    ">
                    ＋ Aggiungi allegato
                </button>

            `;


            box.appendChild(attachments);

            content.appendChild(box);

        }
    );


    const newSection =
        document.createElement("button");

    newSection.textContent =
        "＋ Nuova sezione";

    newSection.onclick =
        addSection;

    content.appendChild(newSection);


    saveData();

}


/* =========================
   BRANI
========================= */

function renderSongs() {

    const container =
        document.getElementById("songs");

    container.innerHTML = "";


    data.songs.forEach(
        (song, index) => {

            const div =
                document.createElement("div");

            div.className =
                "song " +
                (
                    index === data.selectedSong
                        ? "active"
                        : ""
                );


            div.textContent =
                "♪ " + song.name;


            div.onclick = function() {

                data.selectedSong = index;

                render();

            };


            container.appendChild(div);

        }
    );

}


function addSong() {

    const name =
        prompt(
            "Nome del nuovo brano:",
            "Nuovo brano"
        );

    if (!name) return;


    data.songs.push({

        name: name,

        sections: []

    });


    data.selectedSong =
        data.songs.length - 1;


    render();

}


/* =========================
   SEZIONI
========================= */

function addSection() {

    const name =
        prompt(
            "Nome della nuova sezione:",
            "Nuova sezione"
        );

    if (!name) return;


    data
        .songs[data.selectedSong]
        .sections
        .push({

            name: name,

            tasks: [],

            attachments: []

        });


    render();

}


function renameSection(index) {

    const section =
        data
            .songs[data.selectedSong]
            .sections[index];


    const name =
        prompt(
            "Rinomina sezione:",
            section.name
        );


    if (!name) return;


    section.name = name;

    render();

}


function deleteSection(index) {

    if (
        !confirm(
            "Eliminare questa sezione?"
        )
    ) return;


    data
        .songs[data.selectedSong]
        .sections
        .splice(index, 1);


    render();

}


/* =========================
   ATTIVITÀ
========================= */

function addTask(sectionIndex) {

    const text =
        prompt(
            "Nuova attività:"
        );


    if (!text) return;


    data
        .songs[data.selectedSong]
        .sections[sectionIndex]
        .tasks
        .push({

            text: text,

            done: false

        });


    render();

}


function renameTask(
    sectionIndex,
    taskIndex
) {

    const task =
        data
            .songs[data.selectedSong]
            .sections[sectionIndex]
            .tasks[taskIndex];


    const text =
        prompt(
            "Modifica attività:",
            task.text
        );


    if (!text) return;


    task.text = text;

    render();

}


function deleteTask(
    sectionIndex,
    taskIndex
) {

    data
        .songs[data.selectedSong]
        .sections[sectionIndex]
        .tasks
        .splice(taskIndex, 1);


    render();

}


function toggleTask(
    sectionIndex,
    taskIndex
) {

    const task =
        data
            .songs[data.selectedSong]
            .sections[sectionIndex]
            .tasks[taskIndex];


    task.done =
        !task.done;


    render();

}


/* =========================
   ALLEGATI
========================= */

function addAttachment(
    sectionIndex
) {

    const name =
        prompt(
            "Nome dell'allegato o file:"
        );


    if (!name) return;


    data
        .songs[data.selectedSong]
        .sections[sectionIndex]
        .attachments
        .push(name);


    render();

}


/* =========================
   EXPORT
========================= */

function exportData() {

    const json =
        JSON.stringify(
            data,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "Portal-App-aggiornamento.portal.json";


    link.click();


    URL.revokeObjectURL(url);

}


/* =========================
   IMPORT
========================= */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            try {

                data =
                    JSON.parse(
                        reader.result
                    );


                data.selectedSong = 0;


                render();


                alert(
                    "Aggiornamento importato!"
                );

            }

            catch {

                alert(
                    "Il file non è valido."
                );

            }

        };


    reader.readAsText(file);

}


/* =========================
   CALENDARIO
========================= */

function toggleCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.classList.toggle(
        "visible"
    );


    if (
        calendar.classList.contains(
            "visible"
        )
    ) {

        renderCalendar();

    }

}


function renderCalendar() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        now.getMonth();


    const monthName =
        now.toLocaleString(
            "it-IT",
            {
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById(
        "calendarTitle"
    ).textContent =
        monthName;


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    let html = "";


    const weekDays =
        [
            "L",
            "M",
            "M",
            "G",
            "V",
            "S",
            "D"
        ];


    weekDays.forEach(
        day => {

            html +=
                `<div>
                    <strong>
                        ${day}
                    </strong>
                </div>`;

        }
    );


    let offset =
        firstDay === 0
            ? 6
            : firstDay - 1;


    for (
        let i = 0;
        i < offset;
        i++
    ) {

        html +=
            "<div></div>";

    }


    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const isToday =
            day === now.getDate();


        html += `

            <div
                class="${isToday ? "today" : ""}">
                ${day}
            </div>

        `;

    }


    document.getElementById(
        "calendarGrid"
    ).innerHTML =
        html;

}


/* AVVIO */

render();

</script>

</body>
</html>
